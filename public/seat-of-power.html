<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>The Seat of Power</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f6f2ea; -webkit-font-smoothing: antialiased; }
    button, .sop-tap { min-height: 44px; touch-action: manipulation; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; }
    .sop-cta, .sop-choice { min-height: 56px; }
    .sop-safe { width: 100%; max-width: 1800px; margin-left: auto; margin-right: auto; }
    input, select, textarea { font-size: max(var(--t-label), var(--in-fs, 16px)) !important; } /* never below 16 real px, so phones do not zoom in on focus */

    /* ====================================================================
       DESIGN SYSTEM — single source of truth
       --------------------------------------------------------------------
       All values are in ARTBOARD pixels on the 1080-tall stage. The stage is
       scaled by height, so an artboard px is a constant share of screen
       height on every device: 40 artboard px == 3.7% of screen height, which
       is the Executive Command body-text band. Change a number here and it
       changes everywhere — nothing below this block may hardcode its own.
    ==================================================================== */
    :root {
      /* type ladder — compact landscape-phone scale */
      --t-micro:  16px;   /* tiny metadata, stamps          */
      --t-meta:   18px;   /* kickers, stamps, tags          */
      --t-label:  21px;   /* secondary labels, chips        */
      --t-body:   24px;   /* narrative + option text        */
      --t-lead:   27px;   /* emphasised body / option desc  */
      --t-title:  34px;   /* card + section titles          */
      --t-screen: 48px;   /* screen titles                  */
      --t-hero:   68px;   /* logo / hero                    */

      /* spacing ladder — compact */
      --s-1: 6px; --s-2: 10px; --s-3: 16px; --s-4: 24px; --s-5: 36px; --s-6: 52px;

      /* radii — compact */
      --r-sm: 8px; --r-md: 14px; --r-lg: 22px; --r-pill: 999px;

      /* controls — compact, one-thumb friendly */
      --ctl-h: 64px;      /* standard button */
      --ctl-cta-h: 78px;  /* primary call to action */
      --ctl-pad: 16px 36px;

      /* surface + ink (public mode is the default) */
      --sf-bg: #f6f2ea;
      --sf-card: #ffffff;
      --sf-panel: #ffffff;
      --sf-bdr: #e6dfd2;
      --ink: #13261c;
      --ink-mid: #48584e;
      --ink-dim: #8a928b;
      --accent: #0b7a4b;
      --shadow-card: 0 2px 10px rgba(30,40,30,.06);
      --face-font: 'Plus Jakarta Sans', sans-serif;
    }

    /* ---- Three visual modes -------------------------------------------
       Same system, three moods, so the player always knows where they are
       standing: in public, behind a desk, or in a back room. */
    #sop-stage.mode-public {
      --sf-bg: #f6f2ea; --sf-card: #ffffff; --sf-bdr: #e6dfd2;
      --ink: #13261c; --ink-mid: #48584e; --ink-dim: #8a928b; --accent: #0b7a4b;
    }
    #sop-stage.mode-admin {
      /* paper register: memos, forms, stamps */
      --sf-bg: #f3efe6; --sf-card: #fdfbf6;
      --sf-panel: #fdfbf6;
      --sf-bdr: #cfc6ab; --ink: #241f14; --ink-mid: #564c36; --ink-dim: #8b7f63;
      --accent: #1a6d2e; --face-font: 'Fraunces', Georgia, serif;
      --shadow-card: 0 6px 16px rgba(60,48,20,.16);
    }

    #sop-stage.mode-private {
      /* dim, close, intimate — the night meeting */
      --sf-bg: #171a15; --sf-card: #23281f;
      --sf-panel: linear-gradient(180deg,#272d22 0%,#1b1f18 100%);
      --sf-bdr: #3d4636; --ink: #f1efe2; --ink-mid: #c3c8b4; --ink-dim: #8d947f;
      --accent: #d8b64a;
      --shadow-card: 0 18px 44px rgba(0,0,0,.55);
    }
    #sop-stage { transition: background-color .35s ease; background-color: var(--sf-bg); }

    /* ---- Shared component classes -------------------------------------- */
    .ds-meta   { font-size: var(--t-meta);   font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dim); }
    .ds-label  { font-size: var(--t-label);  color: var(--ink-mid); }
    .ds-body   { font-size: var(--t-body);   line-height: 1.55; color: var(--ink-mid); }
    .ds-lead   { font-size: var(--t-lead);   line-height: 1.5;  color: var(--ink); }
    .ds-title  { font-size: var(--t-title);  line-height: 1.25; color: var(--ink); font-family: var(--face-font); font-weight: 700; }
    .ds-screen { font-size: var(--t-screen); line-height: 1.15; color: var(--ink); font-family: 'Fraunces', Georgia, serif; font-weight: 900; }

    .ds-card {
      background: var(--sf-card); border: 1px solid var(--sf-bdr);
      border-radius: var(--r-lg); box-shadow: var(--shadow-card);
      padding: var(--s-5); color: var(--ink);
    }
    .ds-stack > * + * { margin-top: var(--s-4); }

    /* One decision, one screen — the option row */
    .ds-option {
      display: block; width: 100%; text-align: left;
      background: var(--sf-card); border: 1px solid var(--sf-bdr);
      border-radius: var(--r-lg); padding: var(--s-4) var(--s-4);
      min-height: var(--ctl-cta-h); cursor: pointer; color: var(--ink);
      transition: border-color .15s, transform .15s, box-shadow .15s;
      box-shadow: 0 2px 8px rgba(30,40,30,.05);
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 400;
    }
    .ds-option:hover { border-color: var(--accent); }
    .ds-option:active { transform: scale(.985); }
    .ds-option-label { font-size: var(--t-lead); font-weight: 700; color: var(--ink); line-height: 1.3; }
    .ds-option-note  { font-size: var(--t-label); color: var(--ink-dim); margin-top: var(--s-2); }
    /* ---- Phone type: three sizes (see TS in the stage script) ---------- */
    body.sop-portrait #sop-stage {
      --t-micro: 20px; --t-meta: 20px; --t-label: 20px;
      --t-body: 25px; --t-lead: 25px;
      --t-title: 32px; --t-screen: 32px; --t-hero: 32px;
    }
    /* The text-size / fullscreen pill moves into the ☰ menu on phones. */
    body.sop-portrait #sop-fs, body.sop-portrait #sop-tx { display: none !important; }

    /* ---- Phone (tall stage): card-first --------------------------------
       One decision fills the screen as a sheet; options are big, thumb-sized
       tiles. Values are artboard px on the 600-wide portrait stage. */
    #sop-stage.sop-tall img { max-width: 100%; height: auto; }
    #sop-stage.sop-tall .ds-card { border-radius: 28px; padding: 26px 22px; border-width: 1px; box-shadow: 0 2px 12px rgba(30,40,30,.06); }
    #sop-stage.sop-tall .ds-option { border-radius: 24px; padding: 22px 22px; min-height: 96px; border-width: 1px; box-shadow: 0 2px 10px rgba(30,40,30,.05); }
    #sop-stage.sop-tall .ds-option:active { transform: scale(.985); }
    #sop-stage.sop-tall .ds-option-label { font-size: 25px; }
    #sop-stage.sop-tall .ds-option-note { font-size: 20px; }
    #sop-stage.sop-tall .ds-title { font-size: 32px; }
    #sop-stage.sop-tall .ds-body { font-size: 25px; }
    @keyframes sopSheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sop-sheet { animation: sopSheetUp .32s cubic-bezier(.2,.8,.2,1); }
    .sop-tabbar button:active { transform: scale(.96); }
    .ds-chiprow { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-3); }
    .ds-chip {
      display: inline-block; padding: 6px 20px; border-radius: var(--r-pill);
      font-size: var(--t-meta); font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
      border: 0; letter-spacing: .3px;
    }


    /* ---- Fixed 16:9 landscape stage ------------------------------------ */
    /* Full bleed: the stage runs edge to edge, under the notch and the home
       indicator. Safe-area insets are re-applied to the chrome bars only. */
    #sop-viewport {
      position: fixed; inset: 0; overflow: hidden;
      background: #f6f2ea;
    }
    .sop-topbar { padding-left: env(safe-area-inset-left) !important; padding-right: env(safe-area-inset-right) !important; }
    .sop-bottombar { padding-bottom: calc(8px + env(safe-area-inset-bottom)) !important; }
    #sop-stage {
      position: absolute; top: 0; left: 0;
      width: 1920px; height: 1080px;
      transform-origin: top left;
      background: var(--sf-bg);
      overflow: hidden;
    }
    #root { position: relative; width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    /* ---- Phones: the page itself scrolls --------------------------------
       The stage is zoomed (not transformed) to the screen width and grows
       with its content, so the browser does the scrolling and the bottom
       bars pin to the real bottom of the screen. Nothing depends on the
       frame reporting its height correctly (the claude.ai viewer on
       iPhone does not). */
    html.sop-flow, html.sop-flow body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
    html.sop-flow #sop-viewport { position: static; overflow: visible; }
    html.sop-flow #sop-stage { position: relative; overflow: visible; transform: none !important; height: auto !important;
      --stage-h: calc(100dvh / var(--z, 1)); min-height: calc(100vh / var(--z, 1)); min-height: calc(100dvh / var(--z, 1)); }
    html.sop-flow #root { height: auto; min-height: inherit; overflow: visible; }
    #root::-webkit-scrollbar { width: 8px; }
    #root::-webkit-scrollbar-thumb { background: rgba(0,0,0,.22); border-radius: 8px; }

    /* ---- Portrait gate -------------------------------------------------- */
    #sop-rotate {
      position: fixed; inset: 0; z-index: 99999; display: none;
      background: linear-gradient(180deg,#1d3b23 0%,#0f1c12 100%);
      color: #f4f1e8; text-align: center;
      flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      padding: 32px; font-family: 'Plus Jakarta Sans', sans-serif;
    }
    #sop-rotate img { width: 96px; height: 96px; object-fit: contain; opacity: .95; }
    /* NOTE: #sop-rotate and #sop-fs sit OUTSIDE the scaled stage, so these are
       real screen pixels, not artboard pixels — they are exempt from the ladder. */
    #sop-rotate .sop-rot-t { font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 700; letter-spacing: .5px; }
    #sop-rotate .sop-rot-s { font-size: 15px; max-width: 340px; line-height: 1.55; color: #cfd8c8; }
    #sop-rotate .sop-phone {
      width: 74px; height: 46px; border: 3px solid #d8c489; border-radius: 8px;
      animation: sopRot 1.9s ease-in-out infinite;
    }
    @keyframes sopRot { 0%,25% { transform: rotate(90deg); } 60%,100% { transform: rotate(0deg); } }

    /* ---- Fullscreen / lock button (touch devices only) ------------------ */
    #sop-fs {
      position: fixed; z-index: 99998; right: 10px; bottom: 10px; display: none;
      width: 38px; height: 38px; border-radius: 19px; border: 1px solid #e6dfd2;
      background: rgba(255,255,255,.92); color: #13261c; font-size: 18px; line-height: 1;
      align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    #sop-tx {
      position: fixed; z-index: 99998; right: 10px; bottom: 56px;
      width: 38px; height: 38px; border-radius: 19px; border: 1px solid #e6dfd2;
      background: rgba(255,255,255,.92); color: #13261c; font-size: 17px; line-height: 1;
      display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08);
      font-family: 'Fraunces', Georgia, serif; font-weight: 700;
    }
    body.sop-touch #sop-fs { display: flex; }
    /* Portrait: tuck the two utility buttons into a small pill at the top
       right so they stop covering choices at the bottom of the screen. */
    body.sop-portrait #sop-fs, body.sop-portrait #sop-tx {
      top: calc(env(safe-area-inset-top, 0px) + 6px); bottom: auto; width: 30px; height: 30px; min-height: 30px;
      font-size: 14px; border-radius: 8px; opacity: .7;
    }
    body.sop-portrait #sop-tx { right: 44px; }
  </style>
</head>
<body>
  <div id="sop-viewport">
    <div id="sop-stage" class="mode-public">
      <div id="root"></div>
    </div>
  </div>
  <button id="sop-fs" title="Fullscreen">⛶</button>
  <button id="sop-tx" title="Text size">a</button>
  <div id="sop-rotate">
    <div class="sop-phone"></div>
    <div class="sop-rot-t">Turn your phone sideways</div>
    <div class="sop-rot-s">The Seat of Power is played in landscape — rotate your device to take office.</div>
  </div>
  <script>
    /* Character art is served by the hosting platform. Where an image can't
       load (local runs, previews), show a neutral silhouette instead of a
       broken-image icon and alt text; emblems simply disappear. */
    /* Toast: short notices that fade (delayed consequences, warnings).
       Formerly part of sop-v2.js. Appended to body, which the stage script
       below redirects into the scaled stage, so sizes are artboard px. */
    window.SOP_V2_toast = window.SOP_toast = function (msg, kind) {
      var wrap = document.getElementById('sop-toasts');
      if (!wrap) {
        wrap = document.createElement('div'); wrap.id = 'sop-toasts';
        wrap.style.cssText = 'position:fixed;left:16px;right:16px;bottom:120px;z-index:9800;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none';
        document.body.appendChild(wrap);
      }
      /* The same message twice at once is noise: keep one. */
      var same = Array.prototype.find.call(wrap.children, function (c) { return c.textContent === String(msg); });
      if (same) return;
      while (wrap.children.length >= 2) wrap.removeChild(wrap.firstChild);
      var dot = kind === 'warn' ? '#e9c46a' : kind === 'bad' ? '#e5484d' : kind === 'ok' ? '#3fbf7f' : '#e9c46a';
      var t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'pointer-events:none;background:#12301f;color:#fff;padding:12px 20px;border-radius:999px;font:600 22px/1.35 "Plus Jakarta Sans",sans-serif;box-shadow:0 8px 24px rgba(18,48,31,.25);max-width:560px;text-align:center;transition:opacity .3s;border-left:6px solid ' + dot;
      wrap.appendChild(t);
      setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 300); }, 3400);
    };

    (function () {
      var SIL = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160"><circle cx="60" cy="46" r="28" fill="#5b4a3a"/><path d="M8 160c4-46 26-70 52-70s48 24 52 70z" fill="#0f6b3d"/><path d="M44 96l16 30 16-30" fill="#e8e4dc"/></svg>');
      window.addEventListener('error', function (e) {
        var img = e.target;
        if (!img || img.tagName !== 'IMG' || img.dataset.sopFallback) return;
        img.dataset.sopFallback = '1';
        if (/coat|crest|arms|logo|duo|backdrop|statehouse/i.test(img.alt + ' ' + img.src)) { img.style.visibility = 'hidden'; return; }
        img.alt = '';
        img.style.objectFit = 'contain';
        img.style.background = 'linear-gradient(180deg,#d9d2c3,#bfb5a2)';
        img.src = SIL;
      }, true);
    })();
  </script>
  <script>
     /* ====================================================================
        TS(n) — the type snapper.
        Inline React styles cannot read CSS custom properties, so every
        inline fontSize in the game is routed through here. Any loose number
        is pulled onto the nearest rung of a compact landscape-phone ladder.
        Rungs: 16 micro / 18 meta / 21 label / 24 body / 27 lead / 30 option /
              34 title / 38 card / 42 screen / 48 screen / 52 hero / 64 hero / 76 hero
     ==================================================================== */
     (function () {
       var LADDER = [16, 18, 21, 24, 27, 30, 34, 38, 42, 48, 52, 64, 76];
       var cache = {};
       /* Phone (portrait): one type scale with three sizes, in artboard px on
          the 600-wide stage. Every inline size snaps to small, body or
          headline, and nothing is larger than headline. */
       var PHONE = { small: 20, body: 25, headline: 32 };
       window.SOP_PHONE_TYPE = PHONE;
       var phoneCache = {};
       window.TS = function (n) {
         if (typeof n !== 'number' || !isFinite(n)) return 24;
         if (document.body && document.body.classList.contains('sop-portrait')) {
           if (phoneCache[n] !== undefined) return phoneCache[n];
           return (phoneCache[n] = n <= 22 ? PHONE.small : n <= 42 ? PHONE.body : PHONE.headline);
         }
         if (cache[n] !== undefined) return cache[n];
         var v = n < 14 ? 14 : n, best = LADDER[0];
         for (var i = 0; i < LADDER.length; i++) {
           if (Math.abs(LADDER[i] - v) < Math.abs(best - v)) best = LADDER[i];
         }
         if (v > 76) best = Math.round(v);          /* deliberate hero-scale outliers survive */
         return (cache[n] = best);
       };
     })();
    (function () {
      var W = 1920;
      var stage = document.getElementById('sop-stage');
      var vp = document.getElementById('sop-viewport');
      var isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      if (isTouch) document.body.classList.add('sop-touch');

      /* Overlay layers built by the sop-*.js modules append to document.body.
         Redirect them into the scaled stage so they stay in the same coordinate
         space as the game (fixed positioning resolves against the stage). */
      var _append = document.body.appendChild.bind(document.body);
      document.body.appendChild = function (node) {
        try {
          if (node && node.nodeType === 1 && node.id !== 'sop-viewport' && node.id !== 'sop-rotate' && node.id !== 'sop-fs') {
            return stage.appendChild(node);
          }
        } catch (e) {}
        return _append(node);
      };

      /* Large-text mode. Rather than restyling 700 call sites, we shrink the
         artboard: a 1080 design mapped onto the viewport at scale 1.0 becomes a
         ~830 design at 1.3, so every rung of the ladder occupies a bigger share
         of the screen. Layout stays identical; the whole game just gets bigger. */
      var TXT = 1; try { TXT = parseFloat(localStorage.getItem('sop_text_scale') || '1') || 1; } catch (e) {}
      window.SOP_textScale = function (v) {
        if (typeof v === 'number') { TXT = v; try { localStorage.setItem('sop_text_scale', String(v)); } catch (e) {} fit(); }
        return TXT;
      };

      var lastFit = null;
      var ZOOM_OK = !!(window.CSS && CSS.supports && CSS.supports('zoom', '0.5'));
      function typing() { var a = document.activeElement; return isTouch && a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
      function fit() {
        /* Measure the window, not #sop-viewport: on phones the page scrolls and
           the viewport box is as tall as the content. */
        var w = document.documentElement.clientWidth || vp.clientWidth;
        var h = window.innerHeight || vp.clientHeight;
        var mq = window.matchMedia ? window.matchMedia('(orientation: portrait)').matches : false;
        /* The on-screen keyboard shortens the viewport. Keep the layout and
           scale the player was looking at; only the scrollable height
           changes, so nothing shrinks or flips to landscape while typing. */
        /* Phones (page scrolls): only a width change (rotation) needs a refit.
           Height changes (keyboard, browser bars, the host frame) need nothing. */
        if (lastFit && lastFit.flow && Math.abs(w - lastFit.w) < 4) return;
        if (typing() && lastFit && Math.abs(w - lastFit.w) < 4) {
          stage.style.height = Math.round(h / lastFit.s) + 'px';
          stage.style.setProperty('--stage-h', Math.round(h / lastFit.s) + 'px');
          return;
        }
        /* Portrait-first. A tall screen gets a narrow artboard (PW design px
           across) mapped to the viewport width, and the stage grows downward
           to fill the height. Wide screens keep the landscape artboard. */
        var portrait = h > w || mq;
        document.body.classList.toggle('sop-portrait', portrait);
        document.getElementById('sop-stage').classList.toggle('sop-tall', portrait);
        var s;
        if (portrait) {
          var PW = 600 / TXT;
          s = w / PW;
        } else {
          /* Height-driven fluid stage: the 1080 artboard height maps to the
             viewport height; wide screens get more design px across. */
          var H = 1080 / TXT;
          s = h / H;
          if (w / s < 1400) s = w / 1400;
        }
        if (s > 2.2) s = 2.2;
        var sw = Math.round(w / s), sh = Math.round(h / s);
        var flow = portrait && ZOOM_OK;
        document.documentElement.classList.toggle('sop-flow', flow);
        if (flow) {
          stage.style.transform = ''; stage.style.height = '';
          stage.style.zoom = s;
          stage.style.width = sw + 'px';
          stage.style.setProperty('--z', s);
          stage.style.removeProperty('--stage-h');
          stage.style.setProperty('--in-fs', Math.ceil(16.5 / s) + 'px');
          lastFit = { w: w, h: h, s: s, flow: true };
          return;
        }
        stage.style.zoom = '';
        stage.style.width = sw + 'px';
        stage.style.height = sh + 'px';
        stage.style.transform = 'scale(' + s + ')';
        /* Inputs: at least 16 real px, so phones never zoom on focus. */
        stage.style.setProperty('--in-fs', Math.ceil(16.5 / s) + 'px');
        /* Screens that fill the screen (the setup flow) read this. */
        stage.style.setProperty('--stage-h', sh + 'px');
        lastFit = { w: w, h: h, s: s };
      }
      /* After the keyboard closes, re-measure a few times: phones finish
         the close animation (and report the new height) at different times. */
      document.addEventListener('focusout', function () { [250, 700, 1400].forEach(function (t) { setTimeout(fit, t); }); });
      /* Some hosts (the claude.ai viewer on phones) size the frame after the
         page has loaded without telling it. Re-measure whenever the frame
         changes size, and check twice a second as a backstop, so the bottom
         button bar always sits at the real bottom of the screen. */
      try { if (window.ResizeObserver) new ResizeObserver(function () { fit(); }).observe(vp); } catch (e) {}
      /* Backstop: if the stage's height no longer matches the screen (the
         keyboard shrank it, or the host resized the frame silently), refit. */
      setInterval(function () {
        if (!lastFit || typing()) return;
        var h = window.innerHeight || vp.clientHeight;
        if (Math.abs((document.documentElement.clientWidth || vp.clientWidth) - lastFit.w) > 1) { fit(); return; }
        if (lastFit.flow) return;
        if (Math.abs(h - lastFit.h) > 1 || Math.abs(parseFloat(stage.style.height) - h / lastFit.s) > 2) fit();
      }, 500);
      window.addEventListener('load', function () { fit(); setTimeout(fit, 400); setTimeout(fit, 1500); });
      window.addEventListener('pageshow', function () { setTimeout(fit, 100); });
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', function () { setTimeout(fit, 120); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);

      var txBtn = document.getElementById('sop-tx');
      function txLabel() { txBtn.textContent = TXT > 1.2 ? 'A+' : (TXT > 1 ? 'A' : 'a'); }
      txLabel();
      txBtn.addEventListener('click', function () {
        window.SOP_textScale(TXT >= 1.3 ? 1 : (TXT >= 1.15 ? 1.3 : 1.15));
        txLabel();
      });

      /* Fullscreen toggle; also offered in the game's ☰ menu on phones. */
      window.SOP_fullscreen = function () {
        try {
          if (!document.fullscreenElement) {
            var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
            if (p && p.then) p.then(function () {
              try { screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait'); } catch (e) {}
            }).catch(function () {});
          } else if (document.exitFullscreen) { document.exitFullscreen(); }
        } catch (e) {}
        setTimeout(fit, 200);
      };
      document.getElementById('sop-fs').addEventListener('click', window.SOP_fullscreen);
    })();
  </script>
