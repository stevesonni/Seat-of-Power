<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>The Seat of Power</title>
  <link rel="icon" type="image/webp" href="./art/brand/app-icon.webp" />
  <link rel="apple-touch-icon" href="./art/brand/app-icon.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f6f2ea; -webkit-font-smoothing: antialiased; }
    button, .sop-tap { min-height: 44px; touch-action: manipulation; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; }
    .sop-cta, .sop-choice { min-height: 56px; }
    .sop-safe { width: 100%; max-width: 1800px; margin-left: auto; margin-right: auto; }
    input, select, textarea { font-size: max(var(--t-label), var(--in-fs, 16px)) !important; } /* never below 16 real px, so phones do not zoom in on focus */

    /* ====================================================================
       DESIGN SYSTEM — single source of truth
       --------------------------------------------------------------------
       All values are in ARTBOARD pixels on the 1080-tall stage. The stage is
       scaled by height, so an artboard px is a constant share of screen
       height on every device: 40 artboard px == 3.7% of screen height, which
       is the Executive Command body-text band. Change a number here and it
       changes everywhere — nothing below this block may hardcode its own.
    ==================================================================== */
    :root {
      /* type ladder — compact landscape-phone scale */
      --t-micro:  16px;   /* tiny metadata, stamps          */
      --t-meta:   18px;   /* kickers, stamps, tags          */
      --t-label:  21px;   /* secondary labels, chips        */
      --t-body:   24px;   /* narrative + option text        */
      --t-lead:   27px;   /* emphasised body / option desc  */
      --t-title:  34px;   /* card + section titles          */
      --t-screen: 48px;   /* screen titles                  */
      --t-hero:   68px;   /* logo / hero                    */

      /* spacing ladder — compact */
      --s-1: 6px; --s-2: 10px; --s-3: 16px; --s-4: 24px; --s-5: 36px; --s-6: 52px;

      /* radii — compact */
      --r-sm: 8px; --r-md: 14px; --r-lg: 22px; --r-pill: 999px;

      /* controls — compact, one-thumb friendly */
      --ctl-h: 64px;      /* standard button */
      --ctl-cta-h: 78px;  /* primary call to action */
      --ctl-pad: 16px 36px;

      /* surface + ink (public mode is the default) */
      --sf-bg: #f6f2ea;
      --sf-card: #ffffff;
      --sf-panel: #ffffff;
      --sf-bdr: #e6dfd2;
      --ink: #13261c;
      --ink-mid: #48584e;
      --ink-dim: #8a928b;
      --accent: #0b7a4b;
      --shadow-card: 0 2px 10px rgba(30,40,30,.06);
      --face-font: 'Plus Jakarta Sans', sans-serif;
    }

    /* ---- Three visual modes -------------------------------------------
       Same system, three moods, so the player always knows where they are
       standing: in public, behind a desk, or in a back room. */
    #sop-stage.mode-public {
      --sf-bg: #f6f2ea; --sf-card: #ffffff; --sf-bdr: #e6dfd2;
      --ink: #13261c; --ink-mid: #48584e; --ink-dim: #8a928b; --accent: #0b7a4b;
    }
    #sop-stage.mode-admin {
      /* paper register: memos, forms, stamps */
      --sf-bg: #f3efe6; --sf-card: #fdfbf6;
      --sf-panel: #fdfbf6;
      --sf-bdr: #cfc6ab; --ink: #241f14; --ink-mid: #564c36; --ink-dim: #8b7f63;
      --accent: #1a6d2e; --face-font: 'Fraunces', Georgia, serif;
      --shadow-card: 0 6px 16px rgba(60,48,20,.16);
    }

    #sop-stage.mode-private {
      /* dim, close, intimate — the night meeting */
      --sf-bg: #171a15; --sf-card: #23281f;
      --sf-panel: linear-gradient(180deg,#272d22 0%,#1b1f18 100%);
      --sf-bdr: #3d4636; --ink: #f1efe2; --ink-mid: #c3c8b4; --ink-dim: #8d947f;
      --accent: #d8b64a;
      --shadow-card: 0 18px 44px rgba(0,0,0,.55);
    }
    #sop-stage { transition: background-color .35s ease; background-color: var(--sf-bg); }

    /* ---- Shared component classes -------------------------------------- */
    .ds-meta   { font-size: var(--t-meta);   font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dim); }
    .ds-label  { font-size: var(--t-label);  color: var(--ink-mid); }
    .ds-body   { font-size: var(--t-body);   line-height: 1.55; color: var(--ink-mid); }
    .ds-lead   { font-size: var(--t-lead);   line-height: 1.5;  color: var(--ink); }
    .ds-title  { font-size: var(--t-title);  line-height: 1.25; color: var(--ink); font-family: var(--face-font); font-weight: 700; }
    .ds-screen { font-size: var(--t-screen); line-height: 1.15; color: var(--ink); font-family: 'Fraunces', Georgia, serif; font-weight: 900; }

    .ds-card {
      background: var(--sf-card); border: 1px solid var(--sf-bdr);
      border-radius: var(--r-lg); box-shadow: var(--shadow-card);
      padding: var(--s-5); color: var(--ink);
    }
    .ds-stack > * + * { margin-top: var(--s-4); }

    /* One decision, one screen — the option row */
    .ds-option {
      display: block; width: 100%; text-align: left;
      background: var(--sf-card); border: 1px solid var(--sf-bdr);
      border-radius: var(--r-lg); padding: var(--s-4) var(--s-4);
      min-height: var(--ctl-cta-h); cursor: pointer; color: var(--ink);
      transition: border-color .15s, transform .15s, box-shadow .15s;
      box-shadow: 0 2px 8px rgba(30,40,30,.05);
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 400;
    }
    .ds-option:hover { border-color: var(--accent); }
    .ds-option:active { transform: scale(.985); }
    .ds-option-label { font-size: var(--t-lead); font-weight: 700; color: var(--ink); line-height: 1.3; }
    .ds-option-note  { font-size: var(--t-label); color: var(--ink-dim); margin-top: var(--s-2); }
    /* ---- Phone type: three sizes (see TS in the stage script) ---------- */
    body.sop-portrait #sop-stage {
      --t-micro: 20px; --t-meta: 20px; --t-label: 20px;
      --t-body: 25px; --t-lead: 25px;
      --t-title: 32px; --t-screen: 32px; --t-hero: 32px;
    }
    /* The text-size / fullscreen pill moves into the ☰ menu on phones. */
    body.sop-portrait #sop-fs, body.sop-portrait #sop-tx { display: none !important; }

    /* ---- Phone (tall stage): card-first --------------------------------
       One decision fills the screen as a sheet; options are big, thumb-sized
       tiles. Values are artboard px on the 600-wide portrait stage. */
    #sop-stage.sop-tall img { max-width: 100%; height: auto; }
    #sop-stage.sop-tall .ds-card { border-radius: 28px; padding: 26px 22px; border-width: 1px; box-shadow: 0 2px 12px rgba(30,40,30,.06); }
    #sop-stage.sop-tall .ds-option { border-radius: 24px; padding: 22px 22px; min-height: 96px; border-width: 1px; box-shadow: 0 2px 10px rgba(30,40,30,.05); }
    #sop-stage.sop-tall .ds-option:active { transform: scale(.985); }
    #sop-stage.sop-tall .ds-option-label { font-size: 25px; }
    #sop-stage.sop-tall .ds-option-note { font-size: 20px; }
    #sop-stage.sop-tall .ds-title { font-size: 32px; }
    #sop-stage.sop-tall .ds-body { font-size: 25px; }
    @keyframes sopSheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sop-sheet { animation: sopSheetUp .32s cubic-bezier(.2,.8,.2,1); }
    .sop-tabbar button:active { transform: scale(.96); }
    /* Motion: overlays fade or slide in, each Desk step slides up, and anything
       tappable gives a small press. Off for people who ask for less motion. */
    @keyframes sopFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sopSlideUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes sopSign { to { width: 56%; } }
    @keyframes sopPen { 0% { transform: translate(0,0) rotate(0); } 100% { transform: translate(120%, -4%) rotate(4deg); } }
    /* A flight between drifting clouds (SOP_outcome({ flight })). Positions are % of
       the overlay, so it works on the zoomed stage at any size. */
    .sop-flight { position: fixed; inset: 0; z-index: 9960; overflow: hidden; cursor: pointer; transition: opacity .26s; animation: sopFadeIn .25s ease-out;
      background: linear-gradient(180deg, #3d78b8 0%, #5d9ad6 55%, #93c3ec 100%); }
    .sop-flight .fl-clouds { position: absolute; inset: 0; pointer-events: none; animation: flDriftOut 4.4s linear forwards; }
    .sop-flight .fl-clouds.far { opacity: .55; animation-name: flFarOut; }
    .sop-flight .fl-clouds.near { opacity: .9; animation-name: flNearOut; }
    .sop-flight.home .fl-clouds { animation-name: flDriftHome; } .sop-flight.home .fl-clouds.far { animation-name: flFarHome; } .sop-flight.home .fl-clouds.near { animation-name: flNearHome; }
    .sop-flight .fl-cloud { position: absolute; background: #fff; border-radius: 50%; filter: blur(3px); box-shadow: inset -10px -12px 22px rgba(110,150,195,.35); }
    .sop-flight .near .fl-cloud { filter: blur(5px); }
    .sop-flight .fl-cloud::before, .sop-flight .fl-cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; box-shadow: inherit; }
    .sop-flight .fl-cloud::before { width: 52%; height: 118%; left: 14%; top: -58%; }
    .sop-flight .fl-cloud::after { width: 40%; height: 92%; left: 50%; top: -36%; }
    .sop-flight .fl-plane { position: absolute; width: 56%; max-width: 620px; min-width: 260px; left: -60%; top: 70%; animation: flPlaneOut 4.2s cubic-bezier(.4,.05,.45,1) forwards; filter: drop-shadow(0 14px 18px rgba(10,40,80,.28)); }
    .sop-flight.home .fl-plane { animation-name: flPlaneHome; }
    @media (max-aspect-ratio: 1/1) { .sop-flight .fl-plane { width: 84%; } .sop-flight .fl-sign { width: 94%; height: 34%; } .sop-flight .fl-board { font-size: 24px; } }
    .sop-flight .fl-bob { animation: flBob 1.3s ease-in-out infinite alternate; }
    .sop-flight .fl-plane svg { display: block; width: 100%; height: auto; }
    .sop-flight.home .fl-plane svg { transform: scaleX(-1); }
    .sop-flight.home .fl-plane svg text { transform: scaleX(-1); transform-box: fill-box; transform-origin: center; }
    /* The road sign: a green post, the destination board pointing right, home pointing left. */
    .sop-flight .fl-sign { position: absolute; left: 50%; bottom: 0; width: 46%; max-width: 440px; min-width: 300px; height: 44%; transform: translateX(-50%); z-index: 2; pointer-events: none; }
    .sop-flight .fl-post { position: absolute; left: 50%; bottom: 0; width: 7%; height: 100%; transform: translateX(-50%); border-radius: 6px 6px 0 0; background: linear-gradient(90deg, #0a5a33, #12864e 45%, #0b6b3d 70%, #064527); box-shadow: 6px 0 14px rgba(0,0,0,.25); }
    .sop-flight .fl-post::after { content: ""; position: absolute; left: -90%; right: -90%; bottom: -6px; height: 22px; border-radius: 50%; background: radial-gradient(ellipse at center, #3f8a3a 0 55%, transparent 70%); }
    .sop-flight .fl-board { position: absolute; height: 24%; min-height: 54px; display: flex; align-items: center; color: #fff; font: 900 30px/1 "Plus Jakarta Sans", sans-serif; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
      background: linear-gradient(180deg, #17a35e, #0b7a43 60%, #075c32); filter: drop-shadow(5px 8px 0 rgba(0,40,20,.35)) drop-shadow(0 12px 16px rgba(0,0,0,.25)); }
    .sop-flight .fl-board span { position: relative; z-index: 1; display: block; width: 100%; max-height: 82%; overflow: hidden; white-space: normal; line-height: 1.05; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
    .sop-flight .fl-board.l span { text-align: right; }
    .sop-flight .fl-board::before { content: ""; position: absolute; inset: 5px; border: 3px solid rgba(255,255,255,.9); clip-path: inherit; }
    .sop-flight .fl-board.r { left: 50%; top: 6%; width: 54%; padding: 0 18% 0 6%; clip-path: polygon(0 0, 82% 0, 100% 50%, 82% 100%, 0 100%); justify-content: flex-start; }
    .sop-flight .fl-board.l { right: 50%; top: 36%; width: 54%; padding: 0 6% 0 18%; clip-path: polygon(18% 0, 100% 0, 100% 100%, 18% 100%, 0 50%); justify-content: flex-end; }
    .sop-flight .fl-board::before { inset: 4px; border: 0; background: none; box-shadow: inset 0 0 0 3px rgba(255,255,255,.92); }
    .sop-flight .fl-board.r::before { clip-path: polygon(0 0, 82% 0, 100% 50%, 82% 100%, 0 100%); }
    .sop-flight .fl-board.l::before { clip-path: polygon(18% 0, 100% 0, 100% 100%, 18% 100%, 0 50%); }
    .sop-flight .fl-board.r { transform-origin: 0 50%; } .sop-flight .fl-board.l { transform-origin: 100% 50%; }
    .sop-flight.home .fl-board.l, .sop-flight:not(.home) .fl-board.r { animation: flBoard 1.6s .3s ease-in-out infinite alternate; }
    @keyframes flBoard { from { filter: drop-shadow(5px 8px 0 rgba(0,40,20,.35)) brightness(1); } to { filter: drop-shadow(5px 8px 0 rgba(0,40,20,.35)) brightness(1.18); } }
    .sop-flight .fl-skip { position: absolute; right: 4%; bottom: 3%; text-align: right; color: rgba(255,255,255,.8); font: 700 16px "Plus Jakarta Sans", sans-serif; }
    @keyframes flPlaneOut { 0% { left: -60%; top: 56%; transform: rotate(-12deg) scale(1.05); } 50% { left: 22%; top: 30%; transform: rotate(-10deg) scale(.92); } 100% { left: 108%; top: -8%; transform: rotate(-16deg) scale(.7); } }
    @keyframes flPlaneHome { 0% { left: 108%; top: -6%; transform: rotate(-11deg) scale(.72); } 50% { left: 22%; top: 24%; transform: rotate(-7deg) scale(.9); } 100% { left: -60%; top: 52%; transform: rotate(-3deg) scale(1.05); } }
    @keyframes flBob { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
    @keyframes flFarOut { from { transform: translate(25%, -4%); } to { transform: translate(-15%, 8%); } }
    @keyframes flDriftOut { from { transform: translate(40%, -8%); } to { transform: translate(-35%, 16%); } }
    @keyframes flNearOut { from { transform: translate(75%, -12%); } to { transform: translate(-90%, 34%); } }
    @keyframes flFarHome { from { transform: translate(-25%, 6%); } to { transform: translate(15%, -6%); } }
    @keyframes flDriftHome { from { transform: translate(-40%, 12%); } to { transform: translate(35%, -12%); } }
    @keyframes flNearHome { from { transform: translate(-75%, 26%); } to { transform: translate(90%, -26%); } }
    @media (prefers-reduced-motion: reduce) { .sop-flight .fl-plane, .sop-flight .fl-clouds, .sop-flight .fl-bob, .sop-flight .fl-board { animation: none !important; } .sop-flight .fl-plane { left: 22%; top: 38%; } }
    .sp-still .sop-flight .fl-plane, .sp-still .sop-flight .fl-clouds, .sp-still .sop-flight .fl-bob, .sp-still .sop-flight .fl-board { animation: none !important; } .sp-still .sop-flight .fl-plane { left: 22%; top: 38%; }
    @keyframes sopPaperIn { 0% { opacity: 0; transform: rotate(-8deg) scale(.6); } 100% { opacity: 1; transform: rotate(0) scale(1); } }
    @keyframes sopPresentIn { 0% { opacity: 0; transform: translateX(-40px); } 100% { opacity: 1; transform: translateX(0); } }
    @keyframes sopStamp { 0% { opacity: 0; transform: rotate(-14deg) scale(2.4); } 60% { opacity: 1; transform: rotate(-14deg) scale(.92); } 100% { opacity: 1; transform: rotate(-14deg) scale(1); } }
    @keyframes sopCoin { 0% { transform: translateY(0) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-78vh) rotate(25deg); opacity: 0; } }
    @keyframes sopBurst { 0% { transform: scale(.3) rotate(-20deg); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: .9; } }
    .sop-burst { animation: sopBurst .6s cubic-bezier(.2,1.3,.4,1) both; }
    @media (prefers-reduced-motion: reduce) { .sop-burst { animation: none; } }
    .sp-still .sop-burst { animation: none; }
    .sop-fade-in { animation: sopFadeIn .22s ease-out; }
    .sop-slide-up, .sop-step { animation: sopSlideUp .3s cubic-bezier(.2,.8,.2,1); }
    #sop-stage button, #sop-stage .ds-card { -webkit-tap-highlight-color: transparent; }
    #sop-stage button { transition: transform .12s ease, background-color .2s ease, box-shadow .2s ease, opacity .2s ease; }
    #sop-stage button:not(:disabled):active { transform: scale(.97); }
    #sop-stage .ds-card[style*="cursor: pointer"]:active { transform: scale(.99); }
    @media (prefers-reduced-motion: reduce) {
      .sop-fade-in, .sop-slide-up, .sop-step, .sop-sheet { animation: none; }
      #sop-stage button:active, #sop-stage .ds-card:active { transform: none; }
    }
    /* ---- Game feel: numbers that move, options that answer the finger ---- */
    @keyframes sopBump { 0% { transform: scale(1); } 30% { transform: scale(1.22); } 100% { transform: scale(1); } }
    @keyframes sopDelta { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
    @keyframes sopRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes sopShine { from { background-position: -200% 0; } to { background-position: 200% 0; } }
    .sop-bump { display: inline-block; animation: sopBump .5s cubic-bezier(.2,1.4,.4,1); transition: color .6s; }
    .sop-delta { animation: sopDelta 1.8s ease-out both; }
    .ds-option { position: relative; overflow: hidden; animation: sopRise .34s cubic-bezier(.2,.8,.2,1) both; }
    .ds-option:nth-child(2) { animation-delay: .06s; } .ds-option:nth-child(3) { animation-delay: .12s; } .ds-option:nth-child(4) { animation-delay: .18s; }
    .ds-option::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 5px; border-radius: 0 5px 5px 0; background: var(--accent); opacity: 0; transition: opacity .18s, top .18s, bottom .18s; }
    .ds-option::after { content: "›"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font: 800 30px 'Plus Jakarta Sans', sans-serif; color: var(--ink-dim); opacity: .45; transition: transform .18s, opacity .18s, color .18s; }
    .ds-option > * { padding-right: 26px; }
    @media (hover: hover) {
      .ds-option:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(20,40,25,.12); background: linear-gradient(90deg, rgba(11,122,75,.05), transparent 60%), var(--sf-card); }
      .ds-option:hover::before { opacity: 1; top: 8px; bottom: 8px; }
      .ds-option:hover::after { opacity: 1; color: var(--accent); transform: translate(4px, -50%); }
    }
    .ds-option:active::before { opacity: 1; }
    .ds-card { transition: box-shadow .2s ease, transform .2s ease; }
    @media (hover: hover) { #sop-stage .ds-card[style*="cursor: pointer"]:hover { box-shadow: 0 10px 26px rgba(20,40,25,.12); transform: translateY(-1px); } }
    .sop-tabpane { animation: sopRise .28s cubic-bezier(.2,.8,.2,1); }
    .sop-shine { background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%) no-repeat; background-size: 200% 100%; animation: sopShine 2.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .ds-option, .sop-tabpane, .sop-bump, .sop-delta, .sop-shine { animation: none !important; } }
    .sp-still .ds-option, .sp-still .sop-tabpane, .sp-still .sop-bump, .sp-still .sop-shine { animation: none !important; }
    @keyframes sopUnfold { 0% { opacity: 0; transform: translateY(-28px) scaleY(.35); } 60% { opacity: 1; transform: translateY(4px) scaleY(1.02); } 100% { transform: none; } }
    .sop-letter { transform-origin: top center; animation: sopUnfold .55s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) { .sop-letter { animation: none; } }
    .sp-still .sop-letter { animation: none; }
    @keyframes sopFlame { 0%,100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.12) rotate(3deg); } }
    .sop-flame { animation: sopFlame 1.4s ease-in-out infinite; transform-origin: 50% 90%; }
    @keyframes sopGlow { 0%,100% { box-shadow: 0 6px 0 #0a2a1a, 0 0 0 0 rgba(233,185,73,.0); } 50% { box-shadow: 0 6px 0 #0a2a1a, 0 0 0 6px rgba(233,185,73,.45); } }
    .sop-glow { animation: sopGlow 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .sop-flame, .sop-glow { animation: none; } }
    /* The Chief of Staff answering letters while the governor is away: nothing on screen. */
    .sop-silent .sop-ol { opacity: 0 !important; pointer-events: none !important; }
    @keyframes sopStampBig { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(-16deg) scale(2.6); } 70% { opacity: .95; transform: translate(-50%,-50%) rotate(-16deg) scale(.94); } 100% { opacity: .9; transform: translate(-50%,-50%) rotate(-16deg) scale(1); } }
    @keyframes sopJolt { 0% { transform: translate(0,0); } 25% { transform: translate(-4px,3px); } 50% { transform: translate(3px,-2px); } 75% { transform: translate(-2px,1px); } 100% { transform: none; } }
    @keyframes sopInk { to { clip-path: inset(0 0 0 0); } }
    @keyframes sopPenRun { 0% { transform: translate(0,0) rotate(0); } 100% { transform: translate(160%, -6%) rotate(5deg); opacity: .0; } }
    @keyframes sopStampSmall { 0% { opacity: 0; transform: rotate(-10deg) scale(2.4); } 70% { opacity: .95; transform: rotate(-10deg) scale(.94); } 100% { opacity: .88; transform: rotate(-10deg) scale(1); } }
    .ds-chiprow { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-3); }
    .ds-chip {
      display: inline-block; padding: 6px 20px; border-radius: var(--r-pill);
      font-size: var(--t-meta); font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
      border: 0; letter-spacing: .3px;
    }


    /* ---- Fixed 16:9 landscape stage ------------------------------------ */
    /* Full bleed: the stage runs edge to edge, under the notch and the home

    #sop-rotate {

    #sop-fs {

         of the screen. Layout stays identical; the whole game just gets bigger. */

          return;

        /* Portrait-first. A tall screen gets a narrow artboard (PW design px
           across) mapped to the viewport width, and the stage grows downward
           to fill the height. Wide screens keep the landscape artboard. */

        document.getElementById('sop-stage').classList.toggle('sop-tall', portrait);

        stage.style.width = sw + 'px';
        stage.style.height = sh + 'px';
        stage.style.transform = 'scale(' + s + ')';
        /* Inputs: at least 16 real px, so phones never zoom on focus. */
        stage.style.setProperty('--in-fs', Math.ceil(16.5 / s) + 'px');

      /* Some hosts (the claude.ai viewer on phones) size the frame after the

      window.addEventListener('load', function () { fit(); setTimeout(fit, 400); setTimeout(fit, 1500); });
      window.addEventListener('pageshow', function () { setTimeout(fit, 100); });
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', function () { setTimeout(fit, 120); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);

      var txBtn = document.getElementById('sop-tx');
      function txLabel() { txBtn.textContent = TXT > 1.2 ? 'A+' : (TXT > 1 ? 'A' : 'a'); }
      txLabel();
      txBtn.addEventListener('click', function () {
        window.SOP_textScale(TXT >= 1.3 ? 1 : (TXT >= 1.15 ? 1.3 : 1.15));
        txLabel();
      });

      /* Fullscreen toggle; also offered in the game's ☰ menu on phones. */
      window.SOP_fullscreen = function () {
        try {
          if (!document.fullscreenElement) {
            var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
            if (p && p.then) p.then(function () {

            }).catch(function () {});

        } catch (e) {}

      };
      document.getElementById('sop-fs').addEventListener('click', window.SOP_fullscreen);
    })();
  </script>
