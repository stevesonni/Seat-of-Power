<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Council in session · Seat of Power</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{
 --page:#f6f2ea;--card:#fffdf8;--ink:#13261c;--muted:#5b665f;--line:#e6dfd2;
 --green:#0b7a4b;--deep:#12301f;--gold:#e9c46a;--warn:#c2410c;--red:#b3261e;
 --people:#2563eb;--growth:#0b7a4b;--costs:#7c3aed;
 --r-sm:10px;--r:16px;--r-lg:22px;
 --sh:0 1px 0 rgba(19,38,28,.06),0 6px 18px -8px rgba(19,38,28,.22);
 --sh-lg:0 2px 0 rgba(19,38,28,.08),0 18px 40px -16px rgba(19,38,28,.45);
 --fs-micro:12px;--fs-label:13px;--fs-body:15px;--fs-lead:16px;--fs-title:22px;--fs-hero:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--page);color:var(--ink);font-size:var(--fs-body);line-height:1.4;-webkit-font-smoothing:antialiased}
.serif{font-family:"Fraunces",Georgia,serif}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--deep);color:#fdf8ec;position:sticky;top:0;z-index:20}
.top .yr{display:flex;flex-direction:column;line-height:1.15}
.top .yr b{font-family:Fraunces,serif;font-size:17px;font-weight:600}
.top .yr span{font-size:var(--fs-micro);color:var(--gold);font-weight:600;letter-spacing:.02em}
.top .sp{flex:1}
.moves{display:flex;align-items:center;gap:8px;background:rgba(233,196,106,.14);border:1px solid rgba(233,196,106,.45);border-radius:999px;padding:5px 10px 5px 8px;font-size:var(--fs-label);font-weight:600}
.moves .pips{display:flex;gap:3px}.moves .pips i{width:7px;height:14px;border-radius:3px;background:var(--gold)}
.moves .pips i.off{background:rgba(233,196,106,.25)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fdf8ec}
.dnav{display:none}

/* sub tabs */
.subtabs{display:flex;gap:6px;padding:10px 14px 0;}
.subtabs button{flex:1;height:40px;border-radius:999px;font-weight:600;font-size:var(--fs-label);color:var(--muted);background:var(--card);border:1px solid var(--line)}
.subtabs button.on{background:var(--ink);color:#fdf8ec;border-color:var(--ink)}

/* bottom nav */
.bnav{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;font-size:var(--fs-micro);font-weight:600;color:var(--muted);position:relative;border-radius:12px}
.bnav button img{width:28px;height:28px}
.bnav button.on{color:var(--green);background:rgba(11,122,75,.08)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.kicker{font-size:var(--fs-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.h-title{font-family:Fraunces,serif;font-weight:600;font-size:var(--fs-title);line-height:1.15;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:var(--fs-lead)}
.btn-main{background:var(--green);color:#fff;box-shadow:0 3px 0 #075a37}
.btn-gold{background:var(--gold);color:var(--deep);box-shadow:0 3px 0 #b8933c}
.btn-sec{background:var(--card);color:var(--ink);border:1.5px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.btn-block{width:100%}

/* tags & chips */
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.02em}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.prog{background:#e3f3ea;color:var(--green)}
.tag.bill{background:#e5edfd;color:var(--people)}
.tag.order{background:#fbf0d3;color:#8a6410}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:999px;font-size:var(--fs-label);font-weight:700;background:#f1ece2;color:var(--ink)}
.chip.up{background:#e3f3ea;color:var(--green)}
.chip.down{background:#fbe6e4;color:var(--red)}
.chip.cost{background:#efe9fd;color:var(--costs)}

.dnav{display:none}
@media(min-width:900px){
 .dnav{display:flex;gap:4px;margin-left:24px}
 .dnav button{position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;color:#cfe0d4;font-weight:600}
 .dnav button img{width:24px;height:24px}
 .dnav button.on{background:rgba(255,255,255,.1);color:#fff}
 .dnav .badge{top:2px;left:auto;right:4px;border-color:var(--deep)}
 .bnav{display:none}
}

body{background:#000}
.room{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.room>.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.room::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,24,16,.55),rgba(10,24,16,0) 30%,rgba(10,24,16,0) 45%,rgba(10,24,16,.85));z-index:1}
.room>*:not(.bg){position:relative;z-index:2}
.crest{display:flex;align-items:center;gap:12px;color:#fdf8ec}
.crest img{width:72px;height:72px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.crest h1{font-family:Fraunces,serif;font-weight:600;font-size:23px;line-height:1.1}
.crest p{font-size:var(--fs-label);color:var(--gold);font-weight:600;margin-top:2px}
.stack{display:grid;gap:10px}
.decl{background:rgba(255,253,248,.97);border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh-lg);display:grid;gap:10px;border-top:4px solid var(--gold)}
.spk{display:flex;align-items:center;gap:10px}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;background:#e7dcc6;border:2.5px solid var(--gold);flex:none}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;transform:scale(1.5);transform-origin:50% 10%}
.spk b{display:block;font-weight:700}
.spk span{font-size:var(--fs-micro);color:var(--muted);font-weight:600}
.decl q{font-family:Fraunces,serif;font-size:18px;line-height:1.35;font-weight:500;quotes:"“" "”"}
.dq{background:var(--card);border-radius:var(--r-lg);padding:14px;display:grid;gap:10px;box-shadow:var(--sh-lg)}
.dq .h-title{font-size:21px}
.dq .sub{color:var(--muted);font-size:var(--fs-body)}
.opts{display:grid;gap:8px}
.opt{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;gap:7px;box-shadow:0 3px 0 var(--line)}
.opt b{font-size:var(--fs-body);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px}
@media(min-width:900px){
 .room{padding:26px 34px}
 .crest img{width:88px;height:88px}.crest h1{font-size:30px}
 .stack{grid-template-columns:1fr 1.25fr;align-items:end;gap:16px}
 .opts{grid-template-columns:1fr 1fr}
}
</style></head><body><div class="room"><img class="bg" src="art/chamber.webp" alt="The Council Chamber, Government House">
<div class="crest"><img src="art/seal-exco.webp" alt=""><div><h1>State Executive Council</h1><p>First sitting · the Council Chamber, Government House</p></div></div>
<div class="stack"><div class="decl"><div class="spk"><div class="av"><img src="art/official1.webp" alt=""></div><div><b>Alhaji Tunde Salami</b><span>Secretary to the State Government</span></div></div><q>The Council stands sworn in. Every naira this year passes through this room.</q></div><button class="btn btn-gold btn-block" style="max-width:420px;justify-self:end">Close the session</button></div></div></body></html>
