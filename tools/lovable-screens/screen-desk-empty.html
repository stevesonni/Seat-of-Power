<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Desk (tray clear) · Seat of Power</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{
 --page:#f6f2ea;--card:#fffdf8;--ink:#13261c;--muted:#5b665f;--line:#e6dfd2;
 --green:#0b7a4b;--deep:#12301f;--gold:#e9c46a;--warn:#c2410c;--red:#b3261e;
 --people:#2563eb;--growth:#0b7a4b;--costs:#7c3aed;
 --r-sm:10px;--r:16px;--r-lg:22px;
 --sh:0 1px 0 rgba(19,38,28,.06),0 6px 18px -8px rgba(19,38,28,.22);
 --sh-lg:0 2px 0 rgba(19,38,28,.08),0 18px 40px -16px rgba(19,38,28,.45);
 --fs-micro:12px;--fs-label:13px;--fs-body:15px;--fs-lead:16px;--fs-title:22px;--fs-hero:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--page);color:var(--ink);font-size:var(--fs-body);line-height:1.4;-webkit-font-smoothing:antialiased}
.serif{font-family:"Fraunces",Georgia,serif}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--deep);color:#fdf8ec;position:sticky;top:0;z-index:20}
.top .yr{display:flex;flex-direction:column;line-height:1.15}
.top .yr b{font-family:Fraunces,serif;font-size:17px;font-weight:600}
.top .yr span{font-size:var(--fs-micro);color:var(--gold);font-weight:600;letter-spacing:.02em}
.top .sp{flex:1}
.moves{display:flex;align-items:center;gap:8px;background:rgba(233,196,106,.14);border:1px solid rgba(233,196,106,.45);border-radius:999px;padding:5px 10px 5px 8px;font-size:var(--fs-label);font-weight:600}
.moves .pips{display:flex;gap:3px}.moves .pips i{width:7px;height:14px;border-radius:3px;background:var(--gold)}
.moves .pips i.off{background:rgba(233,196,106,.25)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fdf8ec}
.dnav{display:none}

/* sub tabs */
.subtabs{display:flex;gap:6px;padding:10px 14px 0;}
.subtabs button{flex:1;height:40px;border-radius:999px;font-weight:600;font-size:var(--fs-label);color:var(--muted);background:var(--card);border:1px solid var(--line)}
.subtabs button.on{background:var(--ink);color:#fdf8ec;border-color:var(--ink)}

/* bottom nav */
.bnav{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;font-size:var(--fs-micro);font-weight:600;color:var(--muted);position:relative;border-radius:12px}
.bnav button img{width:28px;height:28px}
.bnav button.on{color:var(--green);background:rgba(11,122,75,.08)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.kicker{font-size:var(--fs-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.h-title{font-family:Fraunces,serif;font-weight:600;font-size:var(--fs-title);line-height:1.15;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:var(--fs-lead)}
.btn-main{background:var(--green);color:#fff;box-shadow:0 3px 0 #075a37}
.btn-gold{background:var(--gold);color:var(--deep);box-shadow:0 3px 0 #b8933c}
.btn-sec{background:var(--card);color:var(--ink);border:1.5px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.btn-block{width:100%}

/* tags & chips */
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.02em}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.prog{background:#e3f3ea;color:var(--green)}
.tag.bill{background:#e5edfd;color:var(--people)}
.tag.order{background:#fbf0d3;color:#8a6410}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:999px;font-size:var(--fs-label);font-weight:700;background:#f1ece2;color:var(--ink)}
.chip.up{background:#e3f3ea;color:var(--green)}
.chip.down{background:#fbe6e4;color:var(--red)}
.chip.cost{background:#efe9fd;color:var(--costs)}

.dnav{display:none}
@media(min-width:900px){
 .dnav{display:flex;gap:4px;margin-left:24px}
 .dnav button{position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;color:#cfe0d4;font-weight:600}
 .dnav button img{width:24px;height:24px}
 .dnav button.on{background:rgba(255,255,255,.1);color:#fff}
 .dnav .badge{top:2px;left:auto;right:4px;border-color:var(--deep)}
 .bnav{display:none}
}

.desk{flex:1;padding:12px 14px 16px;display:grid;gap:12px;grid-template-columns:1fr}
.compound{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/10;box-shadow:var(--sh-lg);border:3px solid var(--deep)}
.compound img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.compound .office{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.compound .ring{width:64px;height:64px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(233,196,106,.35);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(233,196,106,.1)}}
.compound .lbl{background:var(--deep);color:#fdf8ec;font-weight:700;font-size:var(--fs-label);padding:5px 10px;border-radius:999px;border:1.5px solid var(--gold);white-space:nowrap}
.compound .where{position:absolute;left:10px;bottom:10px;background:rgba(18,48,31,.88);color:#fdf8ec;font-size:var(--fs-micro);font-weight:600;padding:5px 9px;border-radius:8px}

.dash{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{padding:10px 12px;display:grid;grid-template-columns:34px 1fr;column-gap:10px;align-items:center}
.stat img{width:34px;height:34px;grid-row:span 2}
.stat .l{font-size:var(--fs-micro);font-weight:600;color:var(--muted)}
.stat .v{font-family:Fraunces,serif;font-weight:700;font-size:24px;line-height:1.05;display:flex;align-items:baseline;gap:6px}
.stat .d{font-family:"Plus Jakarta Sans";font-size:12px;font-weight:700}
.stat .bar{grid-column:1/-1;height:6px;border-radius:99px;background:#efe9de;margin-top:8px;overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:99px}
.up{color:var(--green)}.down{color:var(--red)}

.adv{display:grid;grid-template-columns:86px 1fr;gap:0;overflow:hidden;background:var(--deep);color:#fdf8ec;border:0}
.adv .face{background:linear-gradient(180deg,#1e4a32,#12301f);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;height:100%}
.adv .face img{width:150%;max-width:none;margin-bottom:-120%}
.adv .body{padding:12px 14px;display:grid;gap:8px}
.adv .who{font-size:var(--fs-micro);font-weight:700;color:var(--gold);letter-spacing:.04em}
.adv p{font-size:var(--fs-body);font-weight:500;line-height:1.35}

.tray .head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tray .head img{width:40px}
.tray .head h2{font-family:Fraunces,serif;font-size:19px;font-weight:600;flex:1}
.tray .count{font-weight:800;font-size:var(--fs-label);background:var(--ink);color:#fdf8ec;padding:4px 10px;border-radius:999px}
.letter{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border-bottom:1px dashed var(--line);width:100%;text-align:left}
.letter:last-child{border-bottom:0}
.letter img{width:40px;height:40px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.letter .t{flex:1;min-width:0}
.letter .t b{display:block;font-weight:700;font-size:var(--fs-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.letter .t span{font-size:var(--fs-micro);color:var(--muted);font-weight:500}
.urg{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;flex:none}
.chev{color:var(--muted);font-size:20px}
.clear{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:6px}
.clear small{color:var(--muted);font-size:var(--fs-micro);text-align:center}

@media(min-width:900px){
 .subtabs{max-width:420px;padding:14px 20px 0}
 .desk{grid-template-columns:1.55fr 1fr;grid-template-rows:auto 1fr;padding:12px 20px 20px;gap:14px;align-items:start}
 .compound{grid-row:span 2;aspect-ratio:auto;height:calc(100vh - 140px)}
 .left{display:grid;gap:12px}
 .right{display:grid;gap:12px;grid-column:2;grid-row:1/span 2}
 .dash{grid-template-columns:repeat(4,1fr)}
 .colA{display:grid;gap:12px;grid-template-rows:1fr auto}
}
</style></head><body><div class="app"><header class="top">
  <div class="yr"><b>Year 2 of 4 · 2028</b><span>1st Term · Governor</span></div>
  <nav class="dnav"><button class="on"><img src="art/icon-desk.webp" alt="">Desk<span class="badge">4</span></button><button><img src="art/icon-state.webp" alt="">State</button><button><img src="art/icon-people.webp" alt="">People</button></nav>
  <div class="sp"></div>
  <div class="moves" title="Big moves left this year"><div class="pips"><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i></div>Big moves 5/8</div>
  <button class="iconbtn" aria-label="Menu: Wiki, Help, Sound">☰</button>
</header>
<div class="subtabs"><button class="on">Compound</button><button>Today</button><button>News</button></div>
<main class="desk"><div class="colA"><div class="compound"><img src="art/compound.webp" alt="Government House compound"><div class="office"><div class="ring"></div><span class="lbl">Your office · Government House</span></div><span class="where">Ogun State · Abeokuta</span></div></div><div class="right"><div class="dash"><div class="card stat"><img src="art/icon-approval.webp" alt=""><div class="l">Approval</div><div class="v">58%<span class="d up">+3</span></div><div class="bar"><i style="width:58%;background:var(--people)"></i></div></div><div class="card stat"><img src="art/icon-bank.webp" alt=""><div class="l">In the bank</div><div class="v">₦41.2B<span class="d down">−6.1</span></div><div class="bar"><i style="width:44%;background:var(--green)"></i></div></div><div class="card stat"><img src="art/icon-party.webp" alt=""><div class="l">Party stability</div><div class="v">71%<span class="d up">+1</span></div><div class="bar"><i style="width:71%;background:var(--gold)"></i></div></div><div class="card stat"><img src="art/icon-corruption.webp" alt=""><div class="l">Corruption</div><div class="v">12%<span class="d down">+2</span></div><div class="bar"><i style="width:12%;background:var(--red)"></i></div></div></div><section class="card tray"><div class="head"><img src="art/tray.webp" alt=""><h2>Your mail</h2><span class="count" style="background:var(--green)">0 letters</span></div>
<div style="padding:18px 14px;text-align:center;color:var(--muted);font-weight:500">Every letter is answered.</div>
<div class="clear"><button class="btn btn-main btn-block">The tray is clear: on to 2029 →</button></div></section></div></main>
<nav class="bnav"><button class="on"><img src="art/icon-desk.webp" alt="">Desk<span class="badge">4</span></button><button><img src="art/icon-state.webp" alt="">State</button><button><img src="art/icon-people.webp" alt="">People</button></nav></div></body></html>
